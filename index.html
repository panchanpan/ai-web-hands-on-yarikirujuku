<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>AIを使ったWeb制作 ハンズオン</title>
  <style>
    :root{color-scheme:light;--ink:#211916;--orange:#ed5314;--cream:#fbf7f1;--line:#ddd5cc}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;background:linear-gradient(135deg,#fff 0%,var(--cream) 58%,#fee8d9 100%);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink)}
    main{width:min(92vw,520px);background:#fff;border:1px solid var(--line);padding:clamp(32px,6vw,56px);box-shadow:0 30px 80px rgba(47,31,22,.10)}
    .eyebrow{margin:0 0 18px;color:var(--orange);font-size:13px;font-weight:700;letter-spacing:.15em}
    h1{margin:0 0 12px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(28px,5vw,42px);line-height:1.35}
    .lead{margin:0 0 32px;color:#6c625d;font-size:15px;line-height:1.8}
    label{display:block;margin:18px 0 8px;font-size:14px;font-weight:700}
    input{width:100%;height:52px;border:1px solid var(--line);border-radius:0;background:#fff;padding:0 15px;font-size:16px;color:var(--ink);outline:none}
    input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(237,83,20,.12)}
    button{width:100%;height:54px;margin-top:24px;border:0;border-radius:0;background:var(--ink);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
    button:hover{background:var(--orange)}
    button:disabled{opacity:.55;cursor:wait}
    #message{min-height:24px;margin:14px 0 0;color:#c53e0b;font-size:14px;line-height:1.6}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">PRIVATE MATERIAL</p>
    <h1>AIを使った<br>Web制作 ハンズオン</h1>
    <p class="lead">閲覧用のユーザー名とパスワードを入力してください。</p>
    <form id="login">
      <label for="username">ユーザー名</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">パスワード</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">資料を開く</button>
      <p id="message" role="alert" aria-live="polite"></p>
    </form>
  </main>

    const EXPECTED_USER='yarikirujuku';
    const bytes=b64=>Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    document.getElementById('login').addEventListener('submit',async event=>{
      event.preventDefault();
      const button=document.getElementById('submit');
      const message=document.getElementById('message');
      const username=document.getElementById('username').value.trim();
      const password=document.getElementById('password').value;
      message.textContent='';
      if(username!==EXPECTED_USER){message.textContent='ユーザー名またはパスワードが違います。';return;}
      button.disabled=true;button.textContent='資料を開いています…';
      try{
        const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
        const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(PAYLOAD.salt),iterations:250000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
        const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(PAYLOAD.iv),tagLength:128},key,bytes(PAYLOAD.data));
        const html=new TextDecoder().decode(decrypted);
        document.open();document.write(html);document.close();
      }catch(error){
        message.textContent='ユーザー名またはパスワードが違います。';
        button.disabled=false;button.textContent='資料を開く';
      }
    });
  </script>
